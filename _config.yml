title: data2comms
description: "PR, comunicação, advocacy e causas orientados por dados. Pesquisa aplicada, imprensa, leitura cultural e mobilização."
url: https://data2comms.com.br
baseurl: ""
lang: pt-BR
permalink: /observatorio/:slug/
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
future: true
timezone: America/Sao_Paulo

collections:
  blog:
    output: false
    permalink: /blog/:name/
  imprensa:
    output: true
    permalink: /imprensa/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      nav_active: "observatorio"
  - scope:
      path: ""
      type: "imprensa"
    values:
      layout: "press"
      nav_active: "imprensa"
  - scope:
      path: "estatutolgbtiqia"
    values:
      sitemap: false
  - scope:
      path: "estatutolgbtqia"
    values:
      sitemap: false
  - scope:
      path: "admin"
    values:
      sitemap: false

exclude:
  - _backups
  - _blog
  - assets/posts
  - blog-legado.html
  - publicacoes.html
  - artigo-achismo-corporativo.html
  - legado-metodo-data-search.html
  - legado-metodo-analise-massa.html
  - legado-metodo-earned-media.html
  - beleza.html
  - comportamento.html
  - moda.html
  - saude.html
  - tecnologia.html
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
