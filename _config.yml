title: data2comms
description: Agência de PR, influência, imprensa, pesquisa e inteligência cultural.
url: https://www.data2comms.com.br
baseurl: ""
permalink: /post/:title/
markdown: kramdown
future: true
timezone: America/Sao_Paulo

collections:
  blog:
    output: false
    permalink: /blog/:name/
  imprensa:
    output: true
    permalink: /imprensa/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "blog"
    values:
      layout: "blog"
  - scope:
      path: ""
      type: "imprensa"
    values:
      layout: "press"

exclude:
  - _posts
  - _blog
  - editorial.html
  - blog.html
  - blog-legado.html
  - publicacoes.html
  - artigo-achismo-corporativo.html
  - metodo.html
  - legado-metodo-data-search.html
  - legado-metodo-analise-massa.html
  - legado-metodo-earned-media.html
  - beleza.html
  - comportamento.html
  - moda.html
  - saude.html
  - tecnologia.html
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

plugins:
  - jekyll-sitemap
