    .top-strip {

    .dossie-navbar {

      align-items: center;

      gap: 0.4rem;

      font-size: 0.85rem;
      font-weight: 600;

      background: #1e293b;
    }
    .dossie-title-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;

      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

      color: #60a5fa;

    .nav-right {
      display: flex;

      gap: 0.6rem;
      flex-shrink: 0;
    }

      color: #ffffff;

      font-size: 0.82rem;

      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: all 0.15s ease;
    }
    .btn-nav-vote:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.45);
    }
    .btn-nav-pressure {
      background: rgba(147, 51, 234, 0.15);
      color: #c084fc;
      border: 1px solid rgba(147, 51, 234, 0.35);

      font-weight: 700;
      padding: 0.45rem 0.85rem;
      border-radius: 0.5rem;

      align-items: center;
      gap: 0.4rem;
      transition: all 0.15s ease;
    }
    .btn-nav-pressure:hover {
      background: rgba(147, 51, 234, 0.25);
      color: #e9d5ff;
    }
    .pdf-frame {
      width: 100%;
      height: calc(100vh - 58px);
      border: none;
      display: block;
      background: #1e293b;
